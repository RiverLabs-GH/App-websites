name: Deploy mark-o site

# Builds the mark-o module and publishes it to GitHub Pages at
# https://<owner>.github.io/App-websites/mark-o/
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'mark-o/**'
      - '.github/workflows/deploy-mark-o.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mark-o
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mark-o/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/App-websites/mark-o/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mark-o/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
